<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3ead6">
  <title>Genesis 42:8–23 · Chant the Verses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1.0.9">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">בְּרֵאשִׁית · GENESIS</p>
      <h1>Chapter 42, verses 8–23</h1>

      <div class="display-controls" aria-label="Display and audio options">
        <label class="audio-toggle" for="audio-toggle">
          <span>Audio</span>
          <input id="audio-toggle" type="checkbox" checked>
          <span class="audio-toggle-track" aria-hidden="true"></span>
        </label>
        <span class="display-controls-spacer" aria-hidden="true"></span>
        <button class="display-toggle active" id="trope-toggle" type="button" aria-pressed="true">Trope</button>
        <button class="display-toggle" id="script-toggle" type="button" aria-pressed="false">Script</button>
      </div>
    </header>

    <section class="passage-card" id="passage" aria-label="Genesis chapter 42, verses 8 through 23"></section>

    <p class="status" id="status" aria-live="polite">Select words to create a phrase, or hover over a saved phrase to hear it.</p>
    <p class="audio-credit">Group recordings saved with Supabase</p>
    <p class="version">Version 1.0.9</p>
  </main>
  <script src="app.js?v=1.0.9"></script>
</body>
</html>
